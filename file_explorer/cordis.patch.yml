# dsh profile 补丁片段 —— 把本插件 host 半边插进 profile 的插件树。
#
# 组合包层（见 package.json 的 dsh.bundle.patch），按 profile 的 package.json 里
# dsh.profile.bundles 的顺序在各 bundle 层中应用。
#
# 宿主半边只有一条接口（POST /api/file-explorer），负责列目录、读文件、写文件；
# 界面全在浏览器半边（lib/client.js，见 package.json 的 dsh.client）。
- insert:
    - id: dsh-file-explorer
      name: dsh-file-explorer
